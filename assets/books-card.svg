<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Children Choice Books — website project</title>
  <desc id="desc">A portfolio project for Children Choice Books, illustrated with a browser window, book covers, a gently moving bookmark and a tracing underline. This is a decorative illustration, not a website screenshot.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132431"/><stop offset="1" stop-color="#0b1421"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ce1e6"/><stop offset="1" stop-color="#3c9da9"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#203044" stroke-opacity=".22"/></pattern>
    <clipPath id="bounds"><rect width="800" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
    .float{animation:float 8s ease-in-out infinite}.bookmark{animation:bookmark 8s ease-in-out infinite}
    .trace{stroke-dasharray:200;animation:trace 8s ease-in-out infinite}.spark{animation:spark 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes bookmark{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
    @keyframes trace{0%,100%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:200;opacity:.35}}
    @keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.float,.bookmark,.trace,.spark{animation:none}}
  </style>
  <g clip-path="url(#bounds)">
    <rect width="800" height="400" fill="#080e19"/>
    <rect x="400" width="400" height="400" fill="url(#grid)"/>
    <path d="M410 0V400" stroke="#203044"/>
    <text x="40" y="49" fill="#7e96aa" font-size="12" letter-spacing="2.4" class="mono">02 / SELECTED PROJECT</text>
    <rect x="40" y="83" width="38" height="4" rx="2" fill="#5ce1e6"/>
    <text x="38" y="138" fill="#f2f8fa" font-size="39" font-weight="750" letter-spacing="-1">CHILDREN</text>
    <text x="38" y="183" fill="#f2f8fa" font-size="39" font-weight="750" letter-spacing="-1">CHOICE BOOKS</text>
    <text x="42" y="223" fill="#5ce1e6" font-size="18">A place for the next chapter.</text>
    <text x="42" y="265" fill="#9cb0c2" font-size="16">Explore the website and</text>
    <text x="42" y="291" fill="#9cb0c2" font-size="16">my dedicated project overview.</text>
    <rect x="40" y="321" width="151" height="31" rx="15.5" fill="#10252c" stroke="#274047"/>
    <circle cx="57" cy="337" r="3" fill="#5ce1e6" class="spark"/>
    <text x="68" y="342" fill="#5ce1e6" font-size="11" class="mono">WEBSITE PROJECT</text>
    <circle cx="607" cy="212" r="157" fill="none" stroke="#203044" stroke-dasharray="2 9"/>
    <g>
      <rect x="441" y="74" width="316" height="248" rx="15" fill="url(#panel)" stroke="#344c60"/>
      <path d="M442 109H756" stroke="#2a4052"/>
      <circle cx="457" cy="92" r="3" fill="#5ce1e6"/><circle cx="469" cy="92" r="3" fill="#486476"/><circle cx="481" cy="92" r="3" fill="#486476"/>
      <rect x="515" y="86" width="177" height="12" rx="6" fill="#1c3041"/>
