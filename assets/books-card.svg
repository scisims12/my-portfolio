    </g>
    <path d="M468 344H488M478 334V354" stroke="#bcf56b" class="spark"/>
    <path d="M725 49H739M732 42V56" stroke="#5ce1e6" class="spark"/>
    <circle cx="752" cy="361" r="3" fill="#bcf56b" class="spark"/>
  </g>
  <rect x=".5" y=".5" width="799" height="399" rx="19.5" fill="none" stroke="#203044"/>
</svg>
