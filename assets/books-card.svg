      <path d="M463 159H624" stroke="#5ce1e6" stroke-width="2" class="trace"/>
      <rect x="463" y="177" width="271" height="44" rx="5" fill="#1a2f3c"/>
      <rect x="474" y="189" width="123" height="5" rx="2" fill="#7196a8"/>
      <rect x="474" y="202" width="87" height="4" rx="2" fill="#426271"/>
      <circle cx="710" cy="199" r="11" fill="#bcf56b"/>
      <path d="M706 199H714M711 196L714 199L711 202" fill="none" stroke="#1c302c" stroke-width="1.5"/>
      <rect x="463" y="238" width="76" height="64" rx="4" fill="#234148"/>
      <rect x="550" y="238" width="77" height="64" rx="4" fill="#263b38"/>
      <rect x="638" y="238" width="96" height="64" rx="4" fill="#253a4b"/>
      <path d="M478 252H524M478 263H515M478 274H521M478 285H507" stroke="#51747c" stroke-width="2"/>
      <path d="M566 253H612M566 265H602M566 277H609" stroke="#60766a" stroke-width="2"/>
      <path d="M651 253H719M651 265H705M651 277H714" stroke="#506b82" stroke-width="2"/>
    </g>
    <g class="float">
      <path d="M561 249L635 231L709 247V351L635 335L561 353Z" fill="#07101a" opacity=".45"/>
      <path d="M550 241Q593 227 635 241Q677 227 720 241V338Q676 324 635 339Q593 324 550 338Z" fill="#bbd0cf" stroke="#223d49" stroke-width="2"/>
      <path d="M550 234Q593 220 635 234V330Q593 315 550 330Z" fill="#dce9dc"/>
      <path d="M635 234Q677 220 720 234V330Q676 315 635 330Z" fill="#b8d5d1"/>
