<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Priyanshu Sharma — Databases. Interfaces. Android.</title>
  <desc id="desc">A neon technical canvas with orbiting data, a moving waveform, and the name Priyanshu Sharma.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a2b3a" stroke-width=".6"/></pattern>
    <radialGradient id="halo"><stop stop-color="#123e46"/><stop offset="1" stop-color="#080e19"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#bcf56b"/><stop offset=".55" stop-color="#5ce1e6"/><stop offset="1" stop-color="#4f81f7"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif} .mono{font-family:Consolas,'Courier New',monospace}
      .orbit{transform-origin:1030px 280px;animation:orbit 8s linear infinite}.reverse{animation-direction:reverse}
      .pulse{animation:pulse 2s ease-in-out infinite}.drift{animation:drift 4s ease-in-out infinite}.packet{animation:packet 4s linear infinite}
      .wave{animation:wave 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes drift{50%{transform:translateY(-9px)}}
      @keyframes packet{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}@keyframes wave{50%{transform:scaleY(.25)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1280" height="640" rx="24" fill="#080e19"/>
  <rect x="720" y="20" width="540" height="520" fill="url(#halo)"/>
  <rect x="1" y="1" width="1278" height="638" rx="24" fill="url(#grid)" stroke="#203044"/>
  <path d="M42 42H1238M42 532H1238" stroke="#203044"/>
  <circle cx="57" cy="67" r="4" fill="#bcf56b" class="pulse"/>
  <text x="73" y="72" fill="#c6d4df" font-size="13" letter-spacing="2.8" class="mono">THE DEVELOPER PORTFOLIO</text>
  <text x="1237" y="72" text-anchor="end" fill="#78909d" font-size="13" class="mono">SCISIMS12 / PERSONAL WORK</text>
  <rect x="58" y="132" width="278" height="30" rx="15" fill="#132320" stroke="#304631"/>
  <text x="75" y="152" font-size="12" letter-spacing="1.4" fill="#bcf56b" class="mono">SQL + WEB + SERVERS + ANDROID</text>
  <text x="53" y="258" fill="#f0f6fa" font-size="88" font-weight="800" letter-spacing="-4">PRIYANSHU</text>
  <text x="53" y="350" fill="#f0f6fa" font-size="102" font-weight="800" letter-spacing="-4">SHARMA<tspan fill="#bcf56b">.</tspan></text>
  <text x="59" y="401" fill="#5ce1e6" font-size="22" font-weight="500">Databases. Interfaces. Android.</text>
  <text x="59" y="439" fill="#9baebb" font-size="17">Building websites. Managing systems. Making Mixify.</text>
  <g class="drift">
    <circle cx="1030" cy="280" r="178" fill="none" stroke="#213f48"/>
    <circle cx="1030" cy="280" r="145" fill="none" stroke="#274657" stroke-dasharray="3 12"/>
    <circle cx="1030" cy="280" r="106" fill="#0c1724" stroke="#315768"/>
    <g class="orbit"><circle cx="1030" cy="102" r="6" fill="#bcf56b"/><path d="M1030 102a178 178 0 0 1 173 135" fill="none" stroke="#5ce1e6" stroke-width="2"/></g>
    <g class="orbit reverse"><circle cx="1030" cy="135" r="5" fill="#5ce1e6"/></g>
    <path d="M985 246L951 280L985 314M1075 246L1109 280L1075 314M1047 235L1013 325" fill="none" stroke="url(#line)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="868" y="157" width="102" height="36" rx="10" fill="#0c1724" stroke="#315768"/><text x="919" y="181" text-anchor="middle" fill="#bde0e5" font-size="13" class="mono">MySQL</text>
    <rect x="1126" y="301" width="102" height="36" rx="10" fill="#0c1724" stroke="#315768"/><text x="1177" y="325" text-anchor="middle" fill="#bde0e5" font-size="13" class="mono">Kotlin</text>
    <rect x="911" y="398" width="102" height="36" rx="10" fill="#0c1724" stroke="#315768"/><text x="962" y="422" text-anchor="middle" fill="#bde0e5" font-size="13" class="mono">React</text>
  </g>
  <path d="M760 470H1205" stroke="#203044"/>
  <path d="M760 470H1205" stroke="#5ce1e6" stroke-width="2" stroke-dasharray="20 280" class="packet"/>
  <g fill="#5ce1e6">
    <rect x="1110" y="561" width="5" height="20" rx="2" class="wave"/>
    <rect x="1122" y="551" width="5" height="40" rx="2" class="wave" style="animation-delay:-.25s"/>
    <rect x="1134" y="543" width="5" height="56" rx="2" class="wave" style="animation-delay:-.5s"/>
    <rect x="1146" y="555" width="5" height="32" rx="2" class="wave" style="animation-delay:-.75s"/>
    <rect x="1158" y="549" width="5" height="44" rx="2" class="wave" style="animation-delay:-1s"/>
    <rect x="1170" y="561" width="5" height="20" rx="2" class="wave" style="animation-delay:-1.25s"/>
  </g>
  <text x="59" y="568" fill="#78909d" font-size="11" letter-spacing="2" class="mono">01 / DATA</text>
  <text x="59" y="594" fill="#d5e1e9" font-size="17">MySQL administration</text>
  <text x="365" y="568" fill="#78909d" font-size="11" letter-spacing="2" class="mono">02 / EXPERIENCES</text>
  <text x="365" y="594" fill="#d5e1e9" font-size="17">Web development</text>
  <text x="670" y="568" fill="#78909d" font-size="11" letter-spacing="2" class="mono">03 / SYSTEMS</text>
  <text x="670" y="594" fill="#d5e1e9" font-size="17">cPanel / WHM / Android</text>
  <rect x="42" y="621" width="1196" height="2" rx="1" fill="url(#line)"/>
</svg>
