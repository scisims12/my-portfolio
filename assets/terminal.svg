  <text x="848" y="104" fill="#78909d" font-size="12" letter-spacing="2">CURRENT TOOLBOX</text>
  <text x="848" y="145" fill="#eef4f8" font-size="20">DATABASES</text>
  <text x="848" y="176" fill="#5ce1e6" font-size="17">WEB / SERVERS</text>
  <text x="848" y="207" fill="#bcf56b" font-size="17">ANDROID / MUSIC</text>
  <rect x="848" y="263" width="290" height="4" rx="2" fill="#203044"/><rect class="bar" x="848" y="263" width="290" height="4" rx="2" fill="#5ce1e6"/>
